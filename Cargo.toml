[package]
name = "lcquay"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Terminal UI for AWS ECR, ECR Public and OCI container registries"
license = "MIT"
repository = "https://github.com/lyokha113/lcquay"
readme = "README.md"
keywords = ["ecr", "docker", "registry", "oci", "tui"]
categories = ["command-line-utilities"]
exclude = ["assets/", ".github/"]

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
async-trait = "0.1.92"
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio", "default-https-client", "sso", "behavior-version-latest"] }
aws-credential-types = "1.3"
aws-sdk-ecr = { version = "1.137.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-ecrpublic = { version = "1.121", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sts = { version = "1.123.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
base64 = "0.23.1"
bollard = "0.21"
bytes = "1.12.1"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
aws-sdk-ecr = { version = "1.137.0", default-features = false, features = ["test-util"] }
aws-sdk-ecrpublic = { version = "1.121", default-features = false, features = ["test-util"] }
aws-sdk-sts = { version = "1.123.0", default-features = false, features = ["test-util"] }
aws-smithy-mocks = "0.3.0"
insta = "1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6"

[package.metadata.deb]
maintainer = "lyokha113 <lyokha113@gmail.com>"
section = "utils"
extended-description = "Browse, push, pull, copy, export and clean up images in AWS ECR, ECR Public and any OCI registry from one terminal UI."
assets = [
    ["target/release/lcquay", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/lcquay/README.md", "644"],
]
